[versions]
agp = "8.11.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigation = "2.8.4"
room = "2.6.1"
sshj = "0.39.0"
coroutines = "1.9.0"
datastore = "1.1.1"
eddsa = "0.3.0"
bouncycastle = "1.78.1"
slf4jAndroid = "1.7.36"
annotation = "1.9.1"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
junit = "4.13.2"
mockk = "1.13.13"
coroutinesTest = "1.9.0"

[libraries]
core-ktx               = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx  = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-service      = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
lifecycle-process      = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose       = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom            = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui             = { group = "androidx.compose.ui", name = "ui" }
compose-material3      = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling     = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
navigation-compose     = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
room-runtime           = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx               = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler          = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sshj                   = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
eddsa                  = { group = "net.i2p.crypto", name = "eddsa", version.ref = "eddsa" }
bouncycastle           = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
slf4j-android          = { group = "org.slf4j", name = "slf4j-android", version.ref = "slf4jAndroid" }
coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
datastore-prefs        = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-annotation    = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
okhttp                 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit                  = { group = "junit", name = "junit", version.ref = "junit" }
mockk                  = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
coroutines-test        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
